        .picker-api-container,
        .picker-iframe-container {
            height: 100%;
            width: 100%;
            position: relative
        }

        .picker-close-button {
            position: absolute;
            z-index: 100;
            top: 12px;
            right: 14px;
            width: 36px;
            height: 36px;
            border-radius: 18px;
            border-width: 0;
            background-color: transparent
        }

        .picker-close-button:hover {
            background-color: rgba(60, 64, 67, .04)
        }

        .picker-close-button:active {
            background-color: rgba(60, 64, 67, .12)
        }

        .picker-close-button-svg {
            fill: #616161
        }

        .content-library .picker-close-button-svg {
            color: var(--dt-on-neutral-container, #3c4043)
        }

        .content-library .picker-loading-container {
            position: absolute;
            height: 100%;
            width: 100%;
            background-color: #f0f4f9;
            -webkit-box-align: center;
            -webkit-align-items: center;
            -moz-box-align: center;
            -ms-flex-align: center;
            align-items: center;
            -webkit-box-pack: space-evenly;
            -webkit-justify-content: space-evenly;
            -moz-box-pack: space-evenly;
            -ms-flex-pack: space-evenly;
            justify-content: space-evenly;
            display: none
        }

        .content-library.loading .picker-loading-container {
            display: -webkit-box;
            display: -webkit-flex;
            display: -moz-box;
            display: -ms-flexbox;
            display: flex;
            background-color: #f0f4f9
        }

        .dark-mode.loading .picker-loading-container {
            background-color: #282a2c
        }

        .dark-mode .picker-close-button {
            fill: #fff
        }

        .picker-close-button:hover {
            background-color: hsla(204, 6%, 46%, .12)
        }

        .picker-close-button:active {
            background-color: hsla(204, 6%, 46%, .12)
        }

        .content-library.loaded .picker-loading-container,
        .content-library.loading .picker-iframe-container,
        .content-library.loading-timed-out .picker-loading-container {
            display: none
        }

        .goog-modalpopup,
        .modal-dialog {
            box-shadow: 0 4px 16px rgba(0, 0, 0, .2);
            background: #fff;
            background-clip: padding-box;
            border: 1px solid #acacac;
            border: 1px solid rgba(0, 0, 0, .333);
            outline: 0;
            position: absolute
        }

        .goog-modalpopup-bg,
        .modal-dialog-bg {
            background: #fff;
            left: 0;
            position: absolute;
            top: 0
        }

        div.goog-modalpopup-bg,
        div.modal-dialog-bg {
            filter: alpha(opacity=75);
            opacity: .75
        }

        .modal-dialog {
            color: #000;
            padding: 30px 42px
        }

        .modal-dialog-title {
            background-color: #fff;
            color: #000;
            cursor: default;
            font-size: 16px;
            font-weight: 400;
            line-height: 24px;
            margin: 0 0 16px
        }

        .modal-dialog-title-close {
            height: 11px;
            opacity: .7;
            padding: 17px;
            position: absolute;
            right: 0;
            top: 0;
            width: 11px
        }

        .modal-dialog-title-close:after {
            content: "";
            background: url(https://ssl.gstatic.com/ui/v1/dialog/close-x.png);
            position: absolute;
            height: 11px;
            width: 11px;
            right: 17px
        }

        .modal-dialog-title-close:hover {
            opacity: 1
        }

        .modal-dialog-content {
            background-color: #fff;
            line-height: 1.4em;
            word-wrap: break-word
        }

        .modal-dialog-buttons {
            margin-top: 16px
        }

        .modal-dialog-buttons button {
            border-radius: 2px;
            background-color: #f5f5f5;
            background-image: -webkit-linear-gradient(top, #f5f5f5, #f1f1f1);
            background-image: -webkit-gradient(linear, left top, left bottom, from(#f5f5f5), to(#f1f1f1));
            background-image: linear-gradient(top, #f5f5f5, #f1f1f1);
            border: 1px solid #dcdcdc;
            border: 1px solid rgba(0, 0, 0, .1);
            color: #444;
            cursor: default;
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
            height: 29px;
            line-height: 27px;
            margin: 0 16px 0 0;
            min-width: 72px;
            outline: 0;
            padding: 0 8px
        }

        .modal-dialog-buttons button:active,
        .modal-dialog-buttons button:hover {
            box-shadow: 0 1px 1px rgba(0, 0, 0, .1);
            background-color: #f8f8f8;
            background-image: -webkit-linear-gradient(top, #f8f8f8, #f1f1f1);
            background-image: -webkit-gradient(linear, left top, left bottom, from(#f8f8f8), to(#f1f1f1));
            background-image: linear-gradient(top, #f8f8f8, #f1f1f1);
            border: 1px solid #c6c6c6;
            color: #333
        }

        .modal-dialog-buttons button:active {
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, .1)
        }

        .modal-dialog-buttons button:focus {
            border: 1px solid #4d90fe
        }

        .modal-dialog-buttons button[disabled] {
            box-shadow: none;
            background: #fff;
            background-image: none;
            border: 1px solid #f3f3f3;
            border: 1px solid rgba(0, 0, 0, .05);
            color: #b8b8b8
        }

        .modal-dialog-buttons .goog-buttonset-action {
            background-color: #4d90fe;
            background-image: -webkit-linear-gradient(top, #4d90fe, #4787ed);
            background-image: -webkit-gradient(linear, left top, left bottom, from(#4d90fe), to(#4787ed));
            background-image: linear-gradient(top, #4d90fe, #4787ed);
            border: 1px solid #3079ed;
            color: #fff
        }

        .modal-dialog-buttons .goog-buttonset-action:active,
        .modal-dialog-buttons .goog-buttonset-action:hover {
